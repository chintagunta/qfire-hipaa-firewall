[project]
name = "qfire-hipaa-firewall"
version = "0.1.0"
description = "Declarative, positive-security prompt firewall for LLM agents — Python port of QFIRE"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [
    { name = "art-abhishek-chintagunta" },
]
keywords = ["prompt-injection", "llm-security", "guardrails", "phi", "hipaa", "prompt-firewall"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Typing :: Typed",
]
dependencies = [
    "pyyaml>=6.0",
    "regex>=2024.5.15",
]

[project.urls]
Homepage = "https://github.com/chintagunta/qfire-hipaa-firewall"
Issues = "https://github.com/chintagunta/qfire-hipaa-firewall/issues"

[dependency-groups]
dev = [
    "pytest>=8.0",
]
docs = [
    "sphinx>=7.0",
    "sphinx-rtd-theme>=2.0",
    "myst-parser>=3.0",
]

[project.scripts]
qfire = "qfire.cli:main"

[project.optional-dependencies]
classifier = [
    "onnxruntime>=1.18",
    "tokenizers>=0.19",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qfire"]
